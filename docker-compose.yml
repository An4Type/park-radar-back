x-camera-worker: &camera-worker
  build:
    context: apps/camera-worker
  image: park-radar-camera-worker:local
  init: true
  shm_size: 1gb
  env_file: .env
  environment: &camera-worker-environment
    INGEST_URL: http://api:3000
    OUTPUT_DIR: /app/screenshots
  # Scratch space only: the worker deletes every frame after analysing it.
  tmpfs:
    - /app/screenshots:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000}
  stop_grace_period: 180s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-parking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: park-radar-api:local
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-parking}:${POSTGRES_PASSWORD:-parking_dev_password}@postgres:5432/${POSTGRES_DB:-parking}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/packages/database/prisma/seed.js && node dist/apps/api/src/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # One worker per camera; add another service with its own CAMERA_ID for each additional camera.
  camera-krakow-agh-stream1:
    <<: *camera-worker
    environment:
      <<: *camera-worker-environment
      CAMERA_ID: krakow-agh-stream1

  # Public access via Cloudflare Tunnel: `docker compose --profile tunnel up -d`.
  # In the Cloudflare dashboard, point the public hostname at http://api:3000.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: .env
    environment:
      RUN_DB_TESTS: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-parking}:${POSTGRES_PASSWORD:-parking_dev_password}@postgres:5432/${POSTGRES_DB:-parking}
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "test"]

volumes:
  postgres_data:
